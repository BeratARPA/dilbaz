name: dilbaz_app
description: Dilbaz language learning app (Android, Windows, web).
publish_to: none
version: 0.2.2+7

environment:
  sdk: ^3.13.0

dependencies:
  crypto: 3.0.7
  dilbaz_engine:
    path: ../packages/engine
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
