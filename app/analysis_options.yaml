include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # Generated Dart code stays analyzed so that compile errors surface; its
  # own `ignore_for_file` headers silence lints. drift's schema snapshots
  # for migration tests are excluded (raw generic types).
  exclude:
    - lib/l10n/gen/**
    - test/drift/*/generated/**
    - build/**
    - android/**
    - web/**
    - windows/**

linter:
  rules:
    # The app is not a published package; widgets and providers document
    # themselves through names. Public API docs are required in the engine.
    public_member_api_docs: false
