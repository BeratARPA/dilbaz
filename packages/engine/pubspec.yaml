name: dilbaz_engine
description: >-
  Dilbaz learning engine: FSRS scheduling, learner model, session planner,
  scoring, metrics and coverage. Pure Dart, no Flutter, IO or language data.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  freezed_annotation: ^3.1.0
  fsrs: ^2.0.1
  json_annotation: ^4.12.0
  meta: ^1.18.3

dev_dependencies:
  analyzer: ^14.4.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  path: ^1.9.1
  test: ^1.32.0
  very_good_analysis: ^11.0.0
  yaml: ^3.1.3
