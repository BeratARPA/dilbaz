# Secret scanning (CI and the pre-commit hook): the default rules plus one
# narrow allowlist for false positives.
title = "Dilbaz gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Item keys (en.ws.hospital.n.1, en.pgram.a1.be_present) in the packs and in the content tests look like tokens to generic-api-key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^content/packs/[^/]+/(?:items/|placement/)?[^/]+\.jsonl$''',
  '''^content/tools/tests/[^/]+\.py$''',
]
regexes = ['''^[a-z]{2,3}\.(?:ws|chunk|gp|sent|pattern|sound|pgram|pdict)\.[a-z0-9_.]+$''']
