# Quality gates on every push and pull request (docs/15-testing.md §5).
# Paid checks (LLM eval, ASR bake-off) run only by hand, never here.
name: ci

# Docs-only changes skip CI to save the free Actions minutes (zero budget,
# docs/18 §0); secrets are still scanned locally by the pre-commit hook.
on:
  push:
    paths-ignore:
      - "docs/**"
      - "prompts/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "prompts/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  DENO_VERSION: "2.9.7"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner --verbose .

  engine:
    name: engine (dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: dart run build_runner build
      - run: dart analyze --fatal-infos
      - run: dart test --coverage-path=coverage/lcov.info
      - run: dart run tool/check_coverage.dart coverage/lcov.info 90

  app:
    name: app (flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The engine's generated code is not in git; the app compiles against it.
      - run: dart pub get && dart run build_runner build
        working-directory: packages/engine
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test

  apk:
    name: android debug apk
    runs-on: ubuntu-latest
    needs: app
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # The APK build ran out of disk; these preinstalled tools are unused here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get && dart run build_runner build
        working-directory: packages/engine
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  database:
    name: database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npx supabase db start
      - run: npx supabase test db
      - if: always()
        run: npx supabase stop --no-backup

  functions:
    name: edge functions (deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: deno fmt --check
      - run: deno lint
      - run: deno test -A
      # The LLM evals: the gold set's shape and the scoring (no provider call).
      - run: deno fmt --check && deno lint && deno test -A
        working-directory: evals

  content:
    name: content tools (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content/tools
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tags; Dependabot bumps the pin.
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
