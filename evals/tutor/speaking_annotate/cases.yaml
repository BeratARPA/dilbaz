# speaking_annotate gold set v1 (docs/07-ai-tutor.md §8): 30 transcripts of
# A1–A2 speaking tasks as speech recognition writes them (lowercase, no
# punctuation, hesitations kept), with the errors a careful annotator marks.
#
# task: an id of content/curation/en/tasks.yaml; the prompt and goal come
#   from the curation, so the cases ask what the app asks.
# errors: the error's words, quoted from `said` (the n-th occurrence with
#   `nth`), and its tag. For a missing word the quote takes the words on
#   both sides of the gap. A model's mark counts when it overlaps the span.
# clauses / error_free: how many clauses, and how many of them without an
#   error; their ratio is the gold EFC.
# outcome: done | partial | not_done against the task's goal.
#
# Only errors that are clearly wrong in standard English are gold; what a
# careful annotator could leave unmarked is not in the set. Transcripts must
# not repeat the prompt's examples (cases_test.ts). Written in a Claude Code
# session; blind check in validation.jsonl.

