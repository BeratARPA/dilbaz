# answer_check gold set v1 (docs/07-ai-tutor.md §8).
#
# Each case is a card of en@1/tr-en@1 and one learner answer that the
# deterministic check does not match (docs/03 §0.5): only such answers reach
# the LLM. `dilbaz-content eval-cases` fills in the prompt, the reference,
# the listed answers, the target and the forms table from the packs and
# writes cases.jsonl; it refuses an answer that a listed one matches.
#
#   card       item key: en.ws.* (word), en.chunk.* (set phrase), en.gp.* (grammar)
#   sent       carrier sentence, without "en.sent." (not for chunks)
#   say        the answer
#   src        asr (default) or typed; conf: ASR confidence (default 0.9)
#   expect     verdicts that count as right
#   target_ok  gold target_ok; left out when either reading is fair
#   tags       for error verdicts: the answer should carry at least one of them
#   why        a short note
#
# Ids: n ASR noise · v variant · p Turkish "o" · t without the target ·
# m error outside the target · f error in the target · s typed misspelling ·
# w wrong · g grammar card · c set phrase · o off target · x fragment ·
# u unintelligible · q misheard or unsure.
#
# Sentences of the prompt's examples are not used here.

