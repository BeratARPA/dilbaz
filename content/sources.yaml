    name: New General Service List
    version: "1.2"
    license: CC BY-SA 4.0
    attribution: >-
      Browne, C., Culligan, B., & Phillips, J. (2013). The New General Service List.
      https://www.newgeneralservicelist.com
    homepage: https://www.newgeneralservicelist.com/new-general-service-list
    files:
      - name: NGSL_1.2_stats.csv
        url: https://www.newgeneralservicelist.com/s/NGSL_12_stats.csv
        sha256: 2098bab8955a120a9766c6282a51d7d578c6cb0a7d946600d2ffb73ba25a0b44

