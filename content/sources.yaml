# Open data sources of the content pipeline (docs/10-content-pipeline.md §2).
#
# `uv run dilbaz-content ingest` (in content/tools) downloads them into
# content/sources/ (git-ignored). Static files are pinned by sha256; a changed
# upstream file stops the ingest until it is reviewed. Rolling exports
# (weekly dumps) are snapshotted by download date, with their checksums in
# SNAPSHOT.json. Every source carries its license and attribution (I-16).

sources:
