[project]
name = "dilbaz-content"
version = "0.1.0"
description = "Dilbaz content pipeline: builds versioned, license-tracked language packs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "wordfreq==3.1.1",
]

[project.scripts]
dilbaz-content = "dilbaz_content.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PT"]
# IPA letters and marks look like Latin ones but are intended here.
allowed-confusables = ["ɑ", "ɡ", "ɪ", "ˈ", "ˌ", "’"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-local-folder = ["sample_sources"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
