# S5 error catalogue for Turkish speakers learning English (docs/10-content-pipeline.md §6).
#
# The closed list of tags that answer checks, hints and the error profile use
# (I-11). Categories follow Swan & Smith, Learner English (2001), chapter on
# Turkish speakers; examples are own. severity: how much the error hurts
# understanding (0-1], the weight in the error profile. examples: "wrong →
# right". pron_map: for pronunciation tags, expected sound → sound said instead.
# Written in a Claude Code session (ADR-0009); license: own.

# --- grammar -------------------------------------------------------------------

- code: art.missing
  category: grammar
  severity: 0.4
  description: "Tekil sayılabilir isimden önce a/an ya da the eksik."
  examples:
    - "I have car. → I have a car."
    - "She is teacher. → She is a teacher."
    - "Close door, please. → Close the door, please."
  grammar_codes: [gp.articles.a_an, gp.articles.the]

- code: art.wrong
  category: grammar
  severity: 0.3
  description: "Yanlış artikel: a yerine an ya da the, ya da tersi."
  examples:
    - "I ate a apple. → I ate an apple."
    - "It's a hour. → It's an hour."
    - "A sun is hot. → The sun is hot."
  grammar_codes: [gp.articles.a_an, gp.articles.the]

- code: art.extra
  category: grammar
  severity: 0.3
  description: "Genel anlamda kullanılan isimden önce gereksiz the."
  examples:
    - "The life is beautiful. → Life is beautiful."
    - "I like the music. → I like music."
    - "The cats are cute. → Cats are cute."
  grammar_codes: [gp.articles.the]

- code: be.missing
  category: grammar
  severity: 0.7
  description: "am/is/are eksik: Türkçedeki ek gibi düşürülmüş."
  examples:
    - "I happy. → I am happy."
    - "She teacher. → She is a teacher."
    - "They at home. → They are at home."
  grammar_codes: [gp.be.present, gp.present_continuous.now]

- code: agr.3sg_s
  category: grammar
  severity: 0.4
  description: "he/she/it ile fiildeki -s eksik ya da gereksiz yerde."
  examples:
    - "He work every day. → He works every day."
    - "She don't like it. → She doesn't like it."
    - "Does he works here? → Does he work here?"
  grammar_codes: [gp.present_simple.affirmative, gp.present_simple.negative, gp.present_simple.questions]

- code: aux.do_missing
  category: grammar
  severity: 0.5
  description: "Soru ya da olumsuz cümlede do/does/did eksik."
  examples:
    - "You like coffee? → Do you like coffee?"
    - "I not understand. → I don't understand."
    - "Where you went? → Where did you go?"
  grammar_codes: [gp.present_simple.negative, gp.present_simple.questions, gp.past_simple.negative_questions]

- code: wo.question
  category: grammar
  severity: 0.5
  description: "Soru sırası yanlış: be ya da do özneden önce gelmemiş."
  examples:
    - "Where you are? → Where are you?"
    - "What you are doing? → What are you doing?"
    - "Why she is sad? → Why is she sad?"
  grammar_codes: [gp.questions.wh, gp.be.questions]

- code: wo.verb_final
  category: grammar
  severity: 0.7
  description: "Fiil Türkçedeki gibi sona gitmiş; İngilizcede fiil özneden hemen sonra gelir."
  examples:
    - "I coffee drink. → I drink coffee."
    - "She English speaks. → She speaks English."
    - "We to the park went. → We went to the park."
  grammar_codes: []

- code: wo.adverb
  category: grammar
  severity: 0.2
  description: "Sıklık ya da zaman zarfı yanlış yerde."
  examples:
    - "I drink always tea. → I always drink tea."
    - "She is late never. → She is never late."
    - "I every day walk. → I walk every day."
  grammar_codes: [gp.adverbs.frequency]

- code: pron.he_she
  category: grammar
  severity: 0.5
  description: "he, she ve it karışmış: Türkçedeki tek \"o\" yerine cinsiyete göre seçilmemiş."
  examples:
    - "My sister is a doctor. He works at night. → She works at night."
    - "My father? She is fine. → He is fine."
    - "I like this car. She is fast. → It is fast."
  grammar_codes: [gp.pronouns.subject, gp.pronouns.object, gp.possessive.adjectives]

- code: pron.subject_missing
  category: grammar
  severity: 0.5
  description: "Özne düşmüş: İngilizcede her cümlenin öznesi söylenir."
  examples:
    - "Is raining. → It is raining."
    - "Am very tired. → I am very tired."
    - "Is a nice day. → It is a nice day."
  grammar_codes: [gp.pronouns.subject]

- code: pron.object
  category: grammar
  severity: 0.3
  description: "Nesne zamiri yerine özne biçimi kullanılmış ya da nesne düşmüş."
  examples:
    - "She loves he. → She loves him."
    - "Can you help I? → Can you help me?"
    - "Do you like it? Yes, I like. → Yes, I like it."
  grammar_codes: [gp.pronouns.object]

- code: poss.form
  category: grammar
  severity: 0.3
  description: "Sahiplik yanlış gösterilmiş: his/her karışmış ya da 's eksik."
  examples:
    - "My mother and his car. → My mother and her car."
    - "This is Ali car. → This is Ali's car."
    - "The name of my sister is Elif. → My sister's name is Elif."
  grammar_codes: [gp.possessive.adjectives, gp.possessive.s]

- code: pl.missing
  category: grammar
  severity: 0.3
  description: "Sayıdan sonra çoğul eki eksik: Türkçede \"iki kitap\", İngilizcede \"two books\"."
  examples:
    - "I have two brother. → I have two brothers."
    - "Three book are on the table. → Three books are on the table."
    - "Many people have car. → Many people have cars."
  grammar_codes: [gp.nouns.plural]

- code: pl.uncountable
  category: grammar
  severity: 0.3
  description: "Sayılamayan isme çoğul eki ya da a/an eklenmiş."
  examples:
    - "I need some informations. → I need some information."
    - "She gave me an advice. → She gave me some advice."
    - "The furnitures are new. → The furniture is new."
  grammar_codes: [gp.countable_uncountable]

- code: quant.much_many
  category: grammar
  severity: 0.2
  description: "much ile many ya da some ile any karışmış."
  examples:
    - "How much books do you have? → How many books do you have?"
    - "I don't have many money. → I don't have much money."
    - "Do you have some questions? → Do you have any questions?"
  grammar_codes: [gp.countable_uncountable]

- code: exist.there_have
  category: grammar
  severity: 0.5
  description: "\"var\" yanlış çevrilmiş: bir yerde bir şey varsa there is/are, birinin bir şeyi varsa have."
  examples:
    - "In my room have a table. → There is a table in my room."
    - "There is a car to me. → I have a car."
    - "Have a problem here. → There is a problem here."
  grammar_codes: [gp.there_is_are, gp.have_got]

- code: tense.simple_continuous
  category: grammar
  severity: 0.4
  description: "Geniş zaman ile şimdiki zaman karışmış: alışkanlık için -ing kullanılmış ya da tersi."
  examples:
    - "I am going to work every day. → I go to work every day."
    - "Look! It rains. → Look! It's raining."
    - "What do you do now? → What are you doing now?"
  grammar_codes: [gp.present_simple_vs_continuous, gp.present_continuous.now, gp.present_simple.affirmative]

- code: tense.past_form
  category: grammar
  severity: 0.3
  description: "did/didn't'tan sonra fiilin geçmiş biçimi kullanılmış ya da düzensiz fiile -ed eklenmiş."
  examples:
    - "Did you went there? → Did you go there?"
    - "I didn't saw him. → I didn't see him."
    - "We goed home. → We went home."
  grammar_codes: [gp.past_simple.negative_questions, gp.past_simple.irregular]

- code: tense.pp_vs_ps
  category: grammar
  severity: 0.3
  description: "Present perfect ile geçmiş zaman karışmış: zamanı belli olan geçmişte present perfect kullanılmış ya da tersi."
  examples:
    - "I have seen him yesterday. → I saw him yesterday."
    - "Did you ever go to London? → Have you ever been to London?"
    - "I have visited Italy in 2020. → I visited Italy in 2020."
  grammar_codes: [gp.present_perfect.experience, gp.past_simple.regular, gp.past_simple.irregular]

- code: tense.future
  category: grammar
  severity: 0.3
  description: "Gelecek biçimi yanlış: will ya da going to'dan sonra fiil yalın değil, ya da be eksik."
  examples:
    - "I will to call you. → I will call you."
    - "I going to visit them. → I'm going to visit them."
    - "It will rains. → It will rain."
  grammar_codes: [gp.future.will, gp.future.going_to]

- code: modal.form
  category: grammar
  severity: 0.3
  description: "can, must, should gibi sözcüklerden sonra to ya da -s gelmiş."
  examples:
    - "I can to swim. → I can swim."
    - "She cans drive. → She can drive."
    - "You should to see a doctor. → You should see a doctor."
  grammar_codes: [gp.can.ability, gp.modals.obligation]

- code: verb.pattern
  category: grammar
  severity: 0.2
  description: "Fiilden sonra to ile -ing karışmış."
  examples:
    - "I enjoy to swim. → I enjoy swimming."
    - "I want going home. → I want to go home."
    - "She likes cook. → She likes cooking."
  grammar_codes: [gp.verb_patterns.to_ing, gp.like_ing]

- code: comp.form
  category: grammar
  severity: 0.2
  description: "Karşılaştırma yanlış kurulmuş: more ile -er birlikte, ya da than yerine from."
  examples:
    - "It is more bigger. → It is bigger."
    - "She is taller from me. → She is taller than me."
    - "This is the most big house. → This is the biggest house."
  grammar_codes: [gp.comparatives, gp.superlatives]

- code: age.form
  category: grammar
  severity: 0.3
  description: "Yaş Türkçedeki kalıpla söylenmiş: yaşta be ve How old kullanılır."
  examples:
    - "How many years are you? → How old are you?"
    - "I have thirty years. → I am thirty years old."
    - "My son is five age. → My son is five."
  grammar_codes: [gp.age]

- code: prep.in_on_at
  category: grammar
  severity: 0.2
  description: "in, on ve at karışmış."
  examples:
    - "I'm free in Monday. → I'm free on Monday."
    - "The film starts on seven. → The film starts at seven."
    - "The keys are in the table. → The keys are on the table."
  grammar_codes: [gp.prepositions.place, gp.prepositions.time]

- code: prep.missing_extra
  category: grammar
  severity: 0.2
  description: "Edat eksik ya da fazla; bazı fiiller Türkçedekinden farklı edat alır."
  examples:
    - "I went to home. → I went home."
    - "I'm listening music. → I'm listening to music."
    - "Let's discuss about it. → Let's discuss it."
  grammar_codes: []

# --- vocabulary ----------------------------------------------------------------

- code: lex.say_tell
  category: vocabulary
  severity: 0.2
  description: "say ile tell karışmış: tell'den sonra kişi gelir (tell me), say'den sonra gelmez."
  examples:
    - "He said me the answer. → He told me the answer."
    - "Tell hello to her. → Say hello to her."
    - "She told that she was tired. → She said that she was tired."
  grammar_codes: []

- code: lex.make_do
  category: vocabulary
  severity: 0.2
  description: "make ile do karışmış: ikisi de \"yapmak\" ama farklı kelimelerle kullanılır."
  examples:
    - "I make my homework. → I do my homework."
    - "Can you do a cake? → Can you make a cake?"
    - "He did a mistake. → He made a mistake."
  grammar_codes: []

- code: lex.see_look_watch
  category: vocabulary
  severity: 0.2
  description: "see, look ve watch karışmış: görmek see, bakmak look at, izlemek watch."
  examples:
    - "Look this picture. → Look at this picture."
    - "I see TV every evening. → I watch TV every evening."
    - "Can you watch the sea from here? → Can you see the sea from here?"
  grammar_codes: []

- code: lex.turn_on_off
  category: vocabulary
  severity: 0.3
  description: "Işık ve cihazlar için \"açmak/kapatmak\" open/close ile çevrilmiş; doğrusu turn on/off."
  examples:
    - "Open the light. → Turn on the light."
    - "Close the TV. → Turn off the TV."
    - "Can you open the radio? → Can you turn on the radio?"
  grammar_codes: []

- code: lex.false_friend
  category: vocabulary
  severity: 0.4
  description: "Türkçedeki benzer kelimeye güvenilmiş (yanlış arkadaş)."
  examples:
    - "My father works in a fabric. (fabrika anlamında) → My father works in a factory."
    - "He is very sympathetic. (sempatik anlamında) → He is very nice."
    - "It's an actual topic. (güncel anlamında) → It's a current topic."
  grammar_codes: []

# --- pronunciation -------------------------------------------------------------

- code: phon.th
  category: pronunciation
  severity: 0.3
  description: "th sesleri /θ/ ve /ð/ yerine t, d, s ya da z söylenmiş."
  examples:
    - "tink → think"
    - "dis → this"
    - "tree (three demek istenirken) → three"
  pron_map: {"θ": "t", "ð": "d"}

- code: phon.w_v
  category: pronunciation
  severity: 0.3
  description: "/w/ yerine /v/ söylenmiş: dudaklar yuvarlanmadan."
  examples:
    - "vork → work"
    - "vine (wine demek istenirken) → wine"
    - "vee → we"
  pron_map: {"w": "v"}

- code: phon.vowel_length
  category: pronunciation
  severity: 0.4
  description: "Kısa ve uzun ünlüler ya da /æ/ ile /e/ ayrılmamış."
  examples:
    - "ship / sheep aynı söylenmiş"
    - "live / leave aynı söylenmiş"
    - "bad / bed aynı söylenmiş"
  pron_map: {"iː": "ɪ", "æ": "e", "uː": "ʊ"}

- code: phon.spelling
  category: pronunciation
  severity: 0.3
  description: "Kelime yazıldığı gibi okunmuş: sessiz harfler ya da -ed sonu."
  examples:
    - "walk → /wɔːk/ (l okunmaz)"
    - "worked → /wɜːkt/ (/ed/ değil)"
    - "Wednesday → /ˈwenzdeɪ/"
  pron_map: {}

- code: phon.epenthesis
  category: pronunciation
  severity: 0.2
  description: "Ünsüz kümesinin başına ya da arasına ünlü eklenmiş."
  examples:
    - "istation → station"
    - "sipor → sport"
    - "tiree → three"
  pron_map: {}

# --- perception ------------------------------------------------------------------

- code: perc.weak_forms
  category: perception
  severity: 0.3
  description: "Hızlı konuşmadaki zayıf biçimler duyulmamış (can/can't, to, of, and)."
  examples:
    - "I can go. ↔ I can't go. ayırt edilmemiş"
    - "a cup of tea → a cup tea diye yazılmış"
    - "I want to go → I want go diye yazılmış"
  grammar_codes: []

- code: perc.endings
  category: perception
  severity: 0.2
  description: "Kelime sonundaki -s ya da -ed duyulmamış."
  examples:
    - "She works → She work diye yazılmış"
    - "We watched a film → We watch a film diye yazılmış"
    - "two books → two book diye yazılmış"
  grammar_codes: []

# --- pragmatics -----------------------------------------------------------------

- code: prag.too_direct
  category: pragmatics
  severity: 0.3
  description: "İstek fazla doğrudan: İngilizcede kibar kalıplar (Can I…?, Could you…?, please) beklenir."
  examples:
    - "Give me a coffee. → Can I have a coffee, please?"
    - "Say again. → Sorry, can you say that again?"
    - "I want the bill. → Can I have the bill, please?"
  grammar_codes: [gp.would_like, gp.can.ability]
