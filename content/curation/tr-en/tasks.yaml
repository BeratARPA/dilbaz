# The learner's side of the speaking tasks (curation/en/tasks.yaml), in
# Turkish: what the task card says (docs/09-ux-motivation.md §5.6).
#
# instructions: one per task, by its id.
#   title: a few words for lists.
#   prompt: what to talk about, addressed to the learner ("sen"), calm and
#     plain (docs/09 §2).
#   phrases: what the task's phrases mean, in the same order; "..." stays
#     where the learner fills in.
# can_do_summaries: our own short summary of each can-do code, as the
#   learner reads it ("…-abilirsin"); not a translation of the descriptor.
#
# Written in a Claude Code session (ADR-0009); license: own. Checked with
# the English side in tasks.validation.jsonl (I-16).

instructions:
  - id: anc_1
    title: "Kendini tanıt"
    prompt: "Kendini tanıt: kim olduğunu, ne iş yaptığını (ya da ne okuduğunu), nerede yaşadığını ve neleri sevdiğini anlat."
    phrases: []

  - id: anc_2
    title: "Dün"
    prompt: "Dün neler yaptın? Sabahtan akşama kadar anlat."
    phrases: []

  - id: anc_3
    title: "Bir sorun"
    prompt: "Son zamanlarda yaşadığın bir sorunu ve onu nasıl çözdüğünü (ya da neden çözemediğini) anlat."
    phrases: []

  - id: daily_routine
    title: "Sıradan bir gün"
    prompt: "Sıradan bir gününü anlat: sabah, gün içinde ve akşam neler yaparsın?"
    phrases:
      - "Genelde saat ...'te kalkarım."
      - "Ondan sonra ..."
      - "Akşamları ..."

  - id: family
    title: "Ailen"
    prompt: "Aileni anlat: kimler var, ne iş yapıyorlar, nerede yaşıyorlar?"
    phrases:
      - "Ailemde ... kişi var."
      - "Annem ... olarak çalışıyor."
      - "Erkek kardeşim ... yaşıyor."

  - id: home
    title: "Evin"
    prompt: "Evini anlat: kaç oda var, odalarda neler var, en sevdiğin yer neresi?"
    phrases:
      - "Dairemde ... oda var."
      - "Oturma odasında bir ... var."
      - "En sevdiğim yer ..."

  - id: favorite_food
    title: "En sevdiğin yemek"
    prompt: "En sevdiğin yemeği anlat: ne, ne zaman yersin, neden seversin?"
    phrases:
      - "En sevdiğim yemek ..."
      - "Onu genelde ... yerim."
      - "Onu seviyorum çünkü ..."

  - id: cafe_order
    title: "Kafede"
    prompt: "Bir kafedesin. Garsona ne yiyip içmek istediğini söyle, fiyatını sor ve hesabı iste."
    phrases:
      - "Bir ... alabilir miyim, lütfen?"
      - "Ne kadar?"
      - "Hesabı alabilir miyim, lütfen?"

  - id: free_time
    title: "Boş zamanın"
    prompt: "Boş zamanlarında neler yaparsın, kiminle yaparsın?"
    phrases:
      - "Boş zamanlarımda ..."
      - "Sık sık ... ile ..."
      - "... çok severim."

  - id: best_friend
    title: "En iyi arkadaşın"
    prompt: "En iyi arkadaşını anlat: adı, yaşı, ne iş yaptığı ve birlikte neler yaptığınız."
    phrases:
      - "En iyi arkadaşımın adı ..."
      - "En iyi arkadaşım ... yaşında."
      - "Sık sık birlikte ..."

  - id: weekends
    title: "Hafta sonların"
    prompt: "Hafta sonları genelde neler yaparsın?"
    phrases:
      - "Hafta sonu ..."
      - "Cumartesi sabahları ..."
      - "Pazar akşamları ..."

  - id: my_city
    title: "Şehrin"
    prompt: "Yaşadığın şehri ya da kasabayı anlat: orada neler var, neyini seviyorsun?"
    phrases:
      - "... şehrinde yaşıyorum."
      - "Şehrimde çok ... var."
      - "Onu seviyorum çünkü ..."

  - id: shopping
    title: "Alışveriş"
    prompt: "Bu haftaki alışverişini anlat: neler alman gerekiyor, nereden alırsın?"
    phrases:
      - "... almam gerekiyor."
      - "Genelde ... giderim."
      - "Orası pahalı değil."

  - id: last_holiday
    title: "Son tatilin"
    prompt: "Son tatilini anlat: nereye gittin, neler yaptın, nasıl geçti?"
    phrases:
      - "Geçen yaz ... gittim."
      - "... kaldık."
      - "En güzel kısmı ..."

  - id: weekend_plans
    title: "Hafta sonu planın"
    prompt: "Önümüzdeki hafta sonu için planların neler: ne yapacaksın, nerede, kiminle?"
    phrases:
      - "Bu hafta sonu ... yapacağım."
      - "Cumartesi ... yapacağız."
      - "Hava güzel olursa ..."

  - id: directions
    title: "Yol tarifi"
    prompt: "Evinden yakındaki bir markete ya da otobüs durağına nasıl gidilir? Adım adım tarif et."
    phrases:
      - "... boyunca düz git."
      - "... sola dön."
      - "... yanında."

  - id: return_item
    title: "Ürün iadesi"
    prompt: "Bir mağazadasın. Geçen hafta aldığın bir ürün çalışmıyor. Sorunu anlat ve ne istediğini söyle: yenisini mi, paranı mı?"
    phrases:
      - "Bu ...'yı geçen hafta aldım."
      - "Çalışmıyor."
      - "Paramı geri alabilir miyim, lütfen?"

  - id: describe_friend
    title: "Bir arkadaşın"
    prompt: "Bir arkadaşını tarif et: neye benziyor, nasıl biri, onu neden seviyorsun?"
    phrases:
      - "Arkadaşımın ... saçları ve ... gözleri var."
      - "Arkadaşım çok ..."
      - "Arkadaşımla vakit geçirmeyi seviyorum çünkü ..."

  - id: childhood
    title: "Çocukluğun"
    prompt: "Çocukluğunu anlat: nerede yaşardın, neler yapardın, neleri severdin?"
    phrases:
      - "Çocukken ... yaşardım."
      - "Her gün okuldan sonra ..."
      - "En sevdiğim oyun ..."

  - id: recent_movie
    title: "Bir film ya da dizi"
    prompt: "Son izlediğin bir filmi ya da diziyi anlat: konusu ne, beğendin mi, neden?"
    phrases:
      - "Geçen hafta ... izledim."
      - "... hakkında."
      - "Beğendim çünkü ..."

  - id: compare_cities
    title: "İki şehir"
    prompt: "Bildiğin iki şehri karşılaştır: hangisi daha büyük, daha ucuz ya da daha güzel? Hangisini tercih edersin, neden?"
    phrases:
      - "... şehri ... şehrinden daha büyük."
      - "... şehrinde hayat daha pahalı."
      - "... şehrini tercih ederim çünkü ..."

  - id: restaurant_problem
    title: "Restoranda bir sorun"
    prompt: "Bir restorandasın ve garson yanlış yemeği getirdi. Sorunu kibarca anlat ve ne sipariş ettiğini söyle."
    phrases:
      - "Affedersiniz, bunu sipariş etmedim."
      - "... sipariş ettim."
      - "Değiştirebilir misiniz, lütfen?"

  - id: learning_english
    title: "İngilizce öğrenmek"
    prompt: "Neden İngilizce öğreniyorsun, nasıl çalışıyorsun? Senin için ne kolay, ne zor?"
    phrases:
      - "İngilizce öğreniyorum çünkü ..."
      - "Genelde ... çalışırım."
      - "Benim için ... zor."

can_do_summaries:
  - code: cd.describe_experience.a1
    summary: "Kendini, aileni, yaşadığın yeri ve günlük hayatını basit cümlelerle anlatabilirsin."
  - code: cd.describe_experience.a2
    summary: "Yaşadıklarını, geçmişte olanları ve planlarını kısa ve birbirine bağlı cümlelerle anlatabilirsin."
  - code: cd.goods_services.a1
    summary: "Kafede ya da dükkânda basit kalıplarla bir şey isteyebilir, fiyat sorabilirsin."
  - code: cd.goods_services.a2
    summary: "Alışverişte ve restoranda ne istediğini söyleyebilir, fiyat ve miktar sorabilirsin."
  - code: cd.information_exchange.a2
    summary: "Yol tarifi gibi basit bilgileri adım adım anlatabilirsin."
  - code: cd.opinion.a2
    summary: "Bir şeyi neden sevdiğini ya da tercih ettiğini basit gerekçelerle söyleyebilir, iki şeyi karşılaştırabilirsin."
