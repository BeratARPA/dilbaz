# The learner's side of the speaking tasks (curation/en/tasks.yaml), in
# Turkish: what the task card says (docs/09-ux-motivation.md §5.6).
#
# instructions: one per task, by its id.
#   title: a few words for lists.
#   prompt: what to talk about, addressed to the learner ("sen"), calm and
#     plain (docs/09 §2).
#   phrases: what the task's phrases mean, in the same order; "..." stays
#     where the learner fills in.
# can_do_summaries: our own short summary of each can-do code, as the
#   learner reads it ("…-abilirsin"); not a translation of the descriptor.
#
# Written in a Claude Code session (ADR-0009); license: own. Checked with
# the English side in tasks.validation.jsonl (I-16).

instructions:
  - id: anc_1
    title: "Kendini tanıt"
    prompt: "Kendini tanıt: kim olduğunu, ne iş yaptığını (ya da ne okuduğunu), nerede yaşadığını ve neleri sevdiğini anlat."
    phrases: []

  - id: anc_2
    title: "Dün"
    prompt: "Dün neler yaptın? Sabahtan akşama kadar anlat."
    phrases: []

  - id: anc_3
    title: "Bir sorun"
    prompt: "Son zamanlarda yaşadığın bir sorunu ve onu nasıl çözdüğünü (ya da neden çözemediğini) anlat."
    phrases: []

  - id: daily_routine
    title: "Sıradan bir gün"
    prompt: "Sıradan bir gününü anlat: sabah, gün içinde ve akşam neler yaparsın?"
    phrases:
      - "Genelde saat ...'te kalkarım."
      - "Ondan sonra ..."
      - "Akşamları ..."

  - id: family
    title: "Ailen"
    prompt: "Aileni anlat: kimler var, ne iş yapıyorlar, nerede yaşıyorlar?"
    phrases:
      - "Ailemde ... kişi var."
      - "Annem ... olarak çalışıyor."
      - "Erkek kardeşim ... yaşıyor."

  - id: home
    title: "Evin"
    prompt: "Evini anlat: kaç oda var, odalarda neler var, en sevdiğin yer neresi?"
    phrases:
      - "Dairemde ... oda var."
      - "Oturma odasında bir ... var."
      - "En sevdiğim yer ..."

  - id: favorite_food
    title: "En sevdiğin yemek"
    prompt: "En sevdiğin yemeği anlat: ne, ne zaman yersin, neden seversin?"
    phrases:
      - "En sevdiğim yemek ..."
      - "Onu genelde ... yerim."
      - "Onu seviyorum çünkü ..."

  - id: cafe_order
    title: "Kafede"
    prompt: "Bir kafedesin. Garsona ne yiyip içmek istediğini söyle, fiyatını sor ve hesabı iste."
    phrases:
      - "Bir ... alabilir miyim, lütfen?"
      - "Ne kadar?"
      - "Hesabı alabilir miyim, lütfen?"

  - id: free_time
    title: "Boş zamanın"
    prompt: "Boş zamanlarında neler yaparsın, kiminle yaparsın?"
    phrases:
      - "Boş zamanlarımda ..."
      - "Sık sık ... ile ..."
      - "... çok severim."

  - id: best_friend
    title: "En iyi arkadaşın"
    prompt: "En iyi arkadaşını anlat: adı, yaşı, ne iş yaptığı ve birlikte neler yaptığınız."
    phrases:
      - "En iyi arkadaşımın adı ..."
      - "En iyi arkadaşım ... yaşında."
      - "Sık sık birlikte ..."

  - id: weekends
    title: "Hafta sonların"
    prompt: "Hafta sonları genelde neler yaparsın?"
    phrases:
      - "Hafta sonu ..."
      - "Cumartesi sabahları ..."
      - "Pazar akşamları ..."

  - id: my_city
    title: "Şehrin"
    prompt: "Yaşadığın şehri ya da kasabayı anlat: orada neler var, neyini seviyorsun?"
    phrases:
      - "... şehrinde yaşıyorum."
      - "Şehrimde çok ... var."
      - "Onu seviyorum çünkü ..."

  - id: shopping
    title: "Alışveriş"
    prompt: "Bu haftaki alışverişini anlat: neler alman gerekiyor, nereden alırsın?"
    phrases:
      - "... almam gerekiyor."
      - "Genelde ... giderim."
      - "Orası pahalı değil."

  - id: last_holiday
    title: "Son tatilin"
    prompt: "Son tatilini anlat: nereye gittin, neler yaptın, nasıl geçti?"
    phrases:
      - "Geçen yaz ... gittim."
      - "... kaldık."
      - "En güzel kısmı ..."

  - id: weekend_plans
    title: "Hafta sonu planın"
    prompt: "Önümüzdeki hafta sonu için planların neler: ne yapacaksın, nerede, kiminle?"
    phrases:
      - "Bu hafta sonu ... yapacağım."
      - "Cumartesi ... yapacağız."
      - "Hava güzel olursa ..."

  - id: directions
    title: "Yol tarifi"
    prompt: "Evinden yakındaki bir markete ya da otobüs durağına nasıl gidilir? Adım adım tarif et."
    phrases:
      - "... boyunca düz git."
      - "... sola dön."
      - "... yanında."

  - id: return_item
    title: "Ürün iadesi"
    prompt: "Bir mağazadasın. Geçen hafta aldığın bir ürün çalışmıyor. Sorunu anlat ve ne istediğini söyle: yenisini mi, paranı mı?"
    phrases:
      - "Bu ...'yı geçen hafta aldım."
      - "Çalışmıyor."
      - "Paramı geri alabilir miyim, lütfen?"

  - id: describe_friend
    title: "Bir arkadaşın"
    prompt: "Bir arkadaşını tarif et: neye benziyor, nasıl biri, onu neden seviyorsun?"
    phrases:
      - "Arkadaşımın ... saçları ve ... gözleri var."
      - "Arkadaşım çok ..."
      - "Arkadaşımla vakit geçirmeyi seviyorum çünkü ..."

  - id: childhood
    title: "Çocukluğun"
    prompt: "Çocukluğunu anlat: nerede yaşardın, neler yapardın, neleri severdin?"
    phrases:
      - "Çocukken ... yaşardım."
      - "Her gün okuldan sonra ..."
      - "En sevdiğim oyun ..."

  - id: recent_movie
    title: "Bir film ya da dizi"
    prompt: "Son izlediğin bir filmi ya da diziyi anlat: konusu ne, beğendin mi, neden?"
    phrases:
      - "Geçen hafta ... izledim."
      - "... hakkında."
      - "Beğendim çünkü ..."

  - id: compare_cities
    title: "İki şehir"
    prompt: "Bildiğin iki şehri karşılaştır: hangisi daha büyük, daha ucuz ya da daha güzel? Hangisini tercih edersin, neden?"
    phrases:
      - "... şehri ... şehrinden daha büyük."
      - "... şehrinde hayat daha pahalı."
      - "... şehrini tercih ederim çünkü ..."

  - id: restaurant_problem
    title: "Restoranda bir sorun"
    prompt: "Bir restorandasın ve garson yanlış yemeği getirdi. Sorunu kibarca anlat ve ne sipariş ettiğini söyle."
    phrases:
      - "Affedersiniz, bunu sipariş etmedim."
      - "... sipariş ettim."
      - "Değiştirebilir misiniz, lütfen?"

  - id: learning_english
    title: "İngilizce öğrenmek"
    prompt: "Neden İngilizce öğreniyorsun, nasıl çalışıyorsun? Senin için ne kolay, ne zor?"
    phrases:
      - "İngilizce öğreniyorum çünkü ..."
      - "Genelde ... çalışırım."
      - "Benim için ... zor."

can_do_summaries:
  - code: cd.describe_experience.a1
    summary: "Kendini, aileni, yaşadığın yeri ve günlük hayatını basit cümlelerle anlatabilirsin."
  - code: cd.describe_experience.a2
    summary: "Yaşadıklarını, geçmişte olanları ve planlarını kısa ve birbirine bağlı cümlelerle anlatabilirsin."
  - code: cd.goods_services.a1
    summary: "Kafede ya da dükkânda basit kalıplarla bir şey isteyebilir, fiyat sorabilirsin."
  - code: cd.goods_services.a2
    summary: "Alışverişte ve restoranda ne istediğini söyleyebilir, fiyat ve miktar sorabilirsin."
  - code: cd.information_exchange.a2
    summary: "Yol tarifi gibi basit bilgileri adım adım anlatabilirsin."
  - code: cd.opinion.a2
    summary: "Bir şeyi neden sevdiğini ya da tercih ettiğini basit gerekçelerle söyleyebilir, iki şeyi karşılaştırabilirsin."

# What the chat cards (curation/en/tasks.yaml chat_cards) mean, in Turkish:
# a title for lists, the question, the follow-ups and the phrases in the
# same order ("..." stays where the speaker fills in). Shown under the
# English at A1-A2 (docs/02 §3). Checked in tasks.validation.jsonl (I-16).
chat_instructions:
  - id: chat_food
    title: "En sevdiğin yemek"
    question: "En sevdiğin yemek ne?"
    follow_ups: ["Onu en iyi kim yapar?", "Onu ne zaman yersin?"]
    phrases: ["En sevdiğim yemek ...", "Onu ... zaman yerim.", "... sevmem."]

  - id: chat_weekend
    title: "Hafta sonu"
    question: "Hafta sonu ne yapmayı seversin?"
    follow_ups: ["Evde kalmayı mı seversin, dışarı çıkmayı mı?", "Geçen hafta sonu ne yaptın?"]
    phrases: ["Hafta sonu ... severim.", "Genelde ...", "Geçen hafta sonu ..."]

  - id: chat_morning
    title: "Sabahlar"
    question: "Sabahları ne yaparsın?"
    follow_ups: ["Çay mı içersin, kahve mi?", "Saat kaçta kalkarsın?"]
    phrases: ["Sabahları ...", "... içerim.", "Saat ...'te kalkarım."]

  - id: chat_animals
    title: "Hayvanlar"
    question: "Hayvanları sever misin?"
    follow_ups: ["En çok hangi hayvanı seversin?", "Çocukken evcil hayvanın var mıydı?"]
    phrases: ["... severim çünkü ...", "En sevdiğim hayvan ...", "Çocukken benim bir ... vardı."]

  - id: chat_music
    title: "Müzik"
    question: "Ne tür müzik seversin?"
    follow_ups: ["En sevdiğin şarkıcı kim?", "Evde şarkı söyler misin?"]
    phrases: ["... severim.", "En sevdiğim şarkıcı ...", "... zaman müzik dinlerim."]

  - id: chat_hometown
    title: "Memleket"
    question: "Nerelisin?"
    follow_ups: ["Memleketin nasıl bir yer?", "Oranın neyini özlüyorsun?"]
    phrases: ["...liyim.", "Memleketim ...", "... özlüyorum."]

  - id: chat_seasons
    title: "Mevsimler"
    question: "En sevdiğin mevsim hangisi?"
    follow_ups: ["O mevsimde neler yaparsın?", "Hangi havayı sevmezsin?"]
    phrases: ["En sevdiğim mevsim ...", "Yazın ...", "... havayı sevmem."]

  - id: chat_friend
    title: "En yakın arkadaşın"
    question: "Bana en yakın arkadaşını anlat."
    follow_ups: ["Nasıl tanıştınız?", "Birlikte neler yaparsınız?"]
    phrases: ["En yakın arkadaşım ...", "... tanıştık.", "... severiz."]

  - id: chat_shopping
    title: "Alışveriş"
    question: "Ne almayı seversin?"
    follow_ups: ["Genelde nereden alışveriş yaparsın?", "En son ne aldın?"]
    phrases: ["... almayı severim.", "Genelde ...'den alışveriş yaparım.", "Geçen hafta ... aldım."]

  - id: chat_clothes
    title: "Giyim"
    question: "Ne giymeyi seversin?"
    follow_ups: ["En sevdiğin renk ne?", "Kıyafet almayı sever misin?"]
    phrases: ["... giymeyi severim.", "En sevdiğim renk ...", "Hiç ... giymem."]

  - id: chat_evening
    title: "Akşamlar"
    question: "Akşamları ne yaparsın?"
    follow_ups: ["Televizyon izler misin?", "Saat kaçta yatarsın?"]
    phrases: ["Akşamları ...", "... izlerim.", "Saat ...'te yatarım."]

  - id: chat_sports
    title: "Spor"
    question: "Sporu sever misin?"
    follow_ups: ["Hangi sporu izlemeyi seversin?", "Bir spor yapar mısın?"]
    phrases: ["... severim.", "Televizyonda ... izlerim.", "... ile ... oynarım."]

  - id: chat_childhood
    title: "Çocukluk"
    question: "Çocukken ne yapmayı severdin?"
    follow_ups: ["En sevdiğin oyun neydi?", "Kiminle oynardın?"]
    phrases: ["Çocukken ... severdim.", "En sevdiğim oyun ...", "Sık sık ... ile oynardım."]

  - id: chat_travel
    title: "Seyahat"
    question: "Nereye seyahat etmek isterdin?"
    follow_ups: ["Neden oraya gitmek istiyorsun?", "Kiminle giderdin?"]
    phrases: ["...'e gitmek isterdim.", "... görmek istiyorum.", "... ile giderdim."]

  - id: chat_movie
    title: "En iyi film"
    question: "Şimdiye kadar izlediğin en iyi film hangisi?"
    follow_ups: ["Ne anlatıyor?", "Kiminle izledin?"]
    phrases: ["Şimdiye kadar izlediğim en iyi film ...", "... anlatıyor.", "... ile izledim."]

  - id: chat_today
    title: "Bugün"
    question: "Bugün günün nasıl geçti?"
    follow_ups: ["En güzel kısmı neydi?", "Komik bir şey oldu mu?"]
    phrases: ["Günüm ... geçti.", "En güzel kısmı ...", "Komik bir şey oldu: ..."]

  - id: chat_plans
    title: "Gelecek hafta sonu"
    question: "Gelecek hafta sonu ne yapacaksın?"
    follow_ups: ["Kimi göreceksin?", "Yapman gereken bir şey var mı?"]
    phrases: ["Gelecek hafta sonu ...", "... göreceğim.", "... gerekiyor."]

  - id: chat_cooking
    title: "Yemek yapmak"
    question: "Yemek yapabilir misin?"
    follow_ups: ["Neyi iyi yapabilirsin?", "En son ne pişirdin?"]
    phrases: ["... yapabilirim.", "... yapmakta iyiyim.", "En son ... pişirdim."]

  - id: chat_holiday
    title: "En güzel tatil"
    question: "En güzel tatilin hangisiydi?"
    follow_ups: ["Nerede kaldınız?", "Orada ne yediniz?"]
    phrases: ["En güzel tatilim ...'deydi.", "...'de kaldık.", "... yedik."]

  - id: chat_dream_house
    title: "Hayalindeki ev"
    question: "Hayalindeki ev nasıl olurdu?"
    follow_ups: ["Nerede olurdu?", "Kaç odası olurdu?"]
    phrases: ["Hayalimdeki ev ... olurdu.", "İçinde ... olurdu.", "Bir ... isterdim."]

  - id: chat_english
    title: "Neden İngilizce?"
    question: "Neden İngilizce öğreniyorsun?"
    follow_ups: ["Sana ne kolay geliyor?", "Sana ne zor geliyor?"]
    phrases: ["İngilizce öğreniyorum çünkü ...", "... bana kolay geliyor.", "... bana zor geliyor."]

  - id: chat_phone
    title: "Telefon"
    question: "Telefonunu ne için kullanıyorsun?"
    follow_ups: ["En çok hangi uygulamayı kullanıyorsun?", "Telefonsuz yaşayabilir miydin?"]
    phrases: ["Telefonumu ... için kullanıyorum.", "En çok ... kullanıyorum.", "Onsuz yaşayamazdım çünkü ..."]

  - id: chat_series
    title: "Dizi"
    question: "Şu an hangi diziyi izliyorsun?"
    follow_ups: ["En sevdiğin karakter kim?", "Tekrar izler miydin?"]
    phrases: ["Şu an ... izliyorum.", "En sevdiğim karakter ...", "Tekrar izlerdim çünkü ..."]

  - id: chat_memory
    title: "Güzel bir anı"
    question: "Bana mutlu bir anını anlat."
    follow_ups: ["Ne zaman oldu?", "Yanında kim vardı?"]
    phrases: ["Mutlu bir anım ...", "... zaman oldu.", "Yanımda ... vardı."]
