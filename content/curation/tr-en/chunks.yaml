# S5 Turkish meanings of the en@1 chunks (docs/10-content-pipeline.md §6).
#
# meaning: the Turkish prompt of the chunk's card (A01).
# context: shown with the prompt where the Turkish alone could mean another
#   chunk ("Ben de." after a positive or a negative sentence).
# note: a short usage note in Turkish.
# variants: other English answers accepted for the card (I-17). Contractions
#   and punctuation are normalized (packs/en/normalization.yaml), so only real
#   alternatives are listed.
# Written in a Claude Code session (ADR-0009); license: own.

# greetings and goodbyes
en.chunk.hello: {meaning: "Merhaba.", variants: ["Hello there."], alternatives: ["Hi.", "Hi there."]}
en.chunk.hi: {meaning: "Selam.", variants: ["Hi there."], alternatives: ["Hello.", "Hey.", "Hey there."]}
en.chunk.good_morning: {meaning: "Günaydın.", variants: ["Morning."]}
en.chunk.good_evening: {meaning: "İyi akşamlar.", context: "karşılaşınca, selam verirken", variants: ["Evening."]}
en.chunk.how_are_you: {meaning: "Nasılsın?", variants: ["How are you doing?"], alternatives: ["How's it going?", "How are things?"]}
en.chunk.i_m_fine_thanks: {meaning: "İyiyim, teşekkürler.", variants: ["I'm fine, thank you.", "Fine, thanks.", "Fine, thank you."], alternatives: ["I'm good, thanks.", "I'm good, thank you.", "I'm OK, thanks.", "I'm well, thanks.", "I'm very well, thank you."]}
en.chunk.and_you: {meaning: "Ya sen?", alternatives: ["How about you?", "What about you?", "And yourself?"]}
