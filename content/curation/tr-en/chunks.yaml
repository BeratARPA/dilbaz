en.chunk.how_s_it_going: {meaning: "Nasıl gidiyor?", note: "Samimi; arkadaşlar arasında.", variants: ["How are things?"]}
en.chunk.nice_to_meet_you: {meaning: "Tanıştığımıza memnun oldum.", variants: ["Pleased to meet you.", "Good to meet you."]}
