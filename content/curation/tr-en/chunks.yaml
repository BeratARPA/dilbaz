# S5 Turkish meanings of the en@1 chunks (docs/10-content-pipeline.md §6).
#
# meaning: the Turkish prompt of the chunk's card (A01).
# context: shown with the prompt where the Turkish alone could mean another
#   chunk ("Ben de." after a positive or a negative sentence).
# note: a short usage note in Turkish.
# variants: other English answers accepted for the card (I-17). Contractions
#   and punctuation are normalized (packs/en/normalization.yaml), so only real
#   alternatives are listed.
# Written in a Claude Code session (ADR-0009); license: own.

# greetings and goodbyes
en.chunk.hello: {meaning: "Merhaba.", variants: ["Hi.", "Hello there."]}
en.chunk.hi: {meaning: "Selam.", variants: ["Hello.", "Hey."]}
en.chunk.good_morning: {meaning: "Günaydın.", variants: ["Morning."]}
