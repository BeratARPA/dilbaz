# Chat cards (A14, docs/03-activities.md): talked about face to face with the
# partner, e.g. at dinner; nothing is recorded. question: what to talk
# about; follow_ups: two questions to go on with; phrases: three sentence
# starters ("..." is the speaker's part). level: the lowest level the card
# suits. Each needs an accepted check in curation/<l1>-en/tasks.validation.jsonl.
chat_cards:
  # --- A1 -----------------------------------------------------------------
  - id: chat_food
    level: A1
    question: "What is your favorite food?"
    follow_ups: ["Who cooks it best?", "When do you eat it?"]
    phrases: ["My favorite food is ...", "I eat it when ...", "I don't like ..."]

  - id: chat_weekend
    level: A1
    question: "What do you like to do on the weekend?"
    follow_ups: ["Do you like to stay home or go out?", "What did you do last weekend?"]
    phrases: ["On the weekend, I like to ...", "I usually ...", "Last weekend, I ..."]

  - id: chat_morning
    level: A1
    question: "What do you do in the morning?"
    follow_ups: ["Do you drink tea or coffee?", "What time do you get up?"]
    phrases: ["In the morning, I ...", "I drink ...", "I get up at ..."]

  - id: chat_animals
    level: A1
    question: "Do you like animals?"
    follow_ups: ["Which animal do you like most?", "Did you have a pet as a child?"]
    phrases: ["I like ... because ...", "My favorite animal is ...", "When I was a child, I had ..."]

  - id: chat_music
    level: A1
    question: "What music do you like?"
    follow_ups: ["Who is your favorite singer?", "Do you sing at home?"]
    phrases: ["I like ...", "My favorite singer is ...", "I listen to music when ..."]

  - id: chat_hometown
    level: A1
    question: "Where are you from?"
    follow_ups: ["What is your hometown like?", "What do you miss about it?"]
    phrases: ["I am from ...", "My hometown is ...", "I miss ..."]

  - id: chat_seasons
    level: A1
    question: "What is your favorite season?"
    follow_ups: ["What do you do in that season?", "What kind of weather don't you like?"]
    phrases: ["My favorite season is ...", "In the summer, I ...", "I don't like ... weather."]

  - id: chat_friend
    level: A1
    question: "Tell me about your best friend."
    follow_ups: ["How did you meet?", "What do you do together?"]
    phrases: ["My best friend is ...", "We met ...", "We like to ..."]

  - id: chat_shopping
    level: A1
    question: "What do you like to buy?"
    follow_ups: ["Where do you usually shop?", "What did you buy last?"]
    phrases: ["I like to buy ...", "I usually shop at ...", "Last week, I bought ..."]

  - id: chat_clothes
    level: A1
    question: "What do you like to wear?"
    follow_ups: ["What is your favorite color?", "Do you like to buy clothes?"]
    phrases: ["I like to wear ...", "My favorite color is ...", "I never wear ..."]

  - id: chat_evening
    level: A1
    question: "What do you do in the evening?"
    follow_ups: ["Do you watch TV?", "What time do you go to bed?"]
    phrases: ["In the evening, I ...", "I watch ...", "I go to bed at ..."]

  - id: chat_sports
    level: A1
    question: "Do you like sports?"
    follow_ups: ["Which sport do you like to watch?", "Do you play a sport?"]
    phrases: ["I like ...", "I watch ... on TV.", "I play ... with ..."]

  # --- A2 -----------------------------------------------------------------
  - id: chat_childhood
    level: A2
    question: "What did you like to do when you were a child?"
    follow_ups: ["What was your favorite game?", "Who did you play with?"]
    phrases: ["When I was a child, I liked ...", "My favorite game was ...", "I often played with ..."]

  - id: chat_travel
    level: A2
    question: "Where would you like to travel?"
    follow_ups: ["Why do you want to go there?", "Who would you go with?"]
    phrases: ["I would like to go to ...", "I want to see ...", "I would go with ..."]

  - id: chat_movie
    level: A2
    question: "What is the best movie you have ever seen?"
    follow_ups: ["What is it about?", "Who did you watch it with?"]
    phrases: ["The best movie I have ever seen is ...", "It is about ...", "I watched it with ..."]

  - id: chat_today
    level: A2
    question: "How was your day today?"
    follow_ups: ["What was the best part?", "Did anything funny happen?"]
    phrases: ["My day was ...", "The best part was ...", "Something funny happened: ..."]

  - id: chat_plans
    level: A2
    question: "What are you going to do next weekend?"
    follow_ups: ["Who are you going to see?", "Is there anything you need to do?"]
    phrases: ["Next weekend, I'm going to ...", "I'm going to see ...", "I need to ..."]

  - id: chat_cooking
    level: A2
    question: "Can you cook?"
    follow_ups: ["What can you cook well?", "What did you cook last?"]
    phrases: ["I can cook ...", "I'm good at making ...", "The last thing I cooked was ..."]

  - id: chat_holiday
    level: A2
    question: "What was your best vacation?"
    follow_ups: ["Where did you stay?", "What did you eat there?"]
    phrases: ["My best vacation was in ...", "We stayed at ...", "We ate ..."]

  - id: chat_dream_house
    level: A2
    question: "What would your dream house be like?"
    follow_ups: ["Where would it be?", "How many rooms would it have?"]
    phrases: ["My dream house would be ...", "It would have ...", "I would like a ..."]

  - id: chat_english
    level: A2
    question: "Why are you learning English?"
    follow_ups: ["What is easy for you?", "What is difficult for you?"]
    phrases: ["I'm learning English because ...", "... is easy for me.", "... is difficult for me."]

  - id: chat_phone
    level: A2
    question: "What do you use your phone for?"
    follow_ups: ["Which app do you use the most?", "Could you live without your phone?"]
    phrases: ["I use my phone to ...", "I use ... the most.", "I couldn't live without it because ..."]

  - id: chat_series
    level: A2
    question: "What series are you watching now?"
    follow_ups: ["Who is your favorite character?", "Would you watch it again?"]
    phrases: ["Now I'm watching ...", "My favorite character is ...", "I would watch it again because ..."]

  - id: chat_memory
    level: A2
    question: "Tell me about a happy memory."
    follow_ups: ["When did it happen?", "Who was with you?"]
    phrases: ["One happy memory is ...", "It happened when ...", "... was with me."]

# Information gap tasks (A15, ADR-0012): two partners, each sees only their
# own role; they talk in English to solve it. type choose: one role is
# asked (lines), the other picks one of four options (answer: chooser and
# option); type differences: each role has six lines, three differ from the
# partner's (answer: the differing lines of each role, from 0). goal: what
# doing the task means, for the speaking annotation. Each needs an accepted
# check in curation/<l1>-en/tasks.validation.jsonl.
info_gaps:
  # --- Who or which (A1) ---------------------------------------------------
  - id: gap_friend
    level: A1
    type: choose
    goal: "Describe a friend and ask questions until the right person among four is found."
    a:
      lines:
        - "My friend is a woman."
        - "She has short black hair."
        - "She wears glasses."
        - "She has a red bag."
    b:
      options:
        - {id: a, text: "A man with short black hair and glasses."}
        - {id: b, text: "A woman with long brown hair and a red bag."}
        - {id: c, text: "A woman with short black hair, glasses and a red bag."}
        - {id: d, text: "A woman with short black hair and a blue bag."}
    answer: {chooser: b, option: c}

  - id: gap_room
    level: A1
    type: choose
    goal: "Describe a hotel room and ask questions until the right room among four is found."
    a:
      lines:
        - "My room is on the second floor."
        - "It has two beds."
        - "It has a big window."
        - "There is no TV."
    b:
      options:
        - {id: a, text: "Second floor, one bed, a big window, no TV."}
        - {id: b, text: "First floor, two beds, a big window, a TV."}
        - {id: c, text: "Second floor, two beds, a big window, no TV."}
        - {id: d, text: "Second floor, two beds, a small window, a TV."}
    answer: {chooser: b, option: c}

  - id: gap_bag
    level: A1
    type: choose
    goal: "Describe a lost bag and ask questions until the right bag among four is found."
    a:
      lines:
        - "I lost my bag at the station."
        - "It is a small black bag."
        - "It has a white star on it."
        - "There is a book and an umbrella in it."
    b:
      options:
        - {id: a, text: "A small black bag with a white star. A book and an umbrella are in it."}
        - {id: b, text: "A big black bag with a white star. A book is in it."}
        - {id: c, text: "A small blue bag with a white star. A book and an umbrella are in it."}
        - {id: d, text: "A small black bag with a white moon. An umbrella is in it."}
    answer: {chooser: b, option: a}

  - id: gap_flat
    level: A2
    type: choose
    goal: "Ask about your partner's needs and choose the right apartment to rent among four."
    a:
      lines:
        - "I need two bedrooms."
        - "I don't have a car, so the apartment must be near a bus stop."
        - "I can pay 700 euros a month."
        - "I have a dog."
    b:
      options:
        - {id: a, text: "Two bedrooms, 650 euros, next to a bus stop, no pets."}
        - {id: b, text: "Two bedrooms, 690 euros, five minutes from a bus stop, pets are OK."}
        - {id: c, text: "Three bedrooms, 900 euros, near a bus stop, pets are OK."}
        - {id: d, text: "Two bedrooms, 600 euros, far from a bus stop, pets are OK."}
    answer: {chooser: b, option: b}

  # --- Plan (A2) -----------------------------------------------------------
  - id: gap_train
    level: A2
    type: choose
    goal: "Ask about the trains and choose the one that fits the time and the budget."
    a:
      lines:
        - "Train 1 leaves at 8:10 and arrives at 10:40. It costs 25 euros."
        - "Train 2 leaves at 8:45 and arrives at 10:20. It costs 30 euros."
        - "Train 3 leaves at 9:00 and arrives at 11:30. It costs 15 euros."
        - "Train 4 leaves at 9:30 and arrives at 10:50. It costs 18 euros."
    b:
      lines:
        - "You can't leave before 9:00."
        - "You must arrive before 11:00."
        - "You can spend 20 euros or less."
      options:
        - {id: t1, text: "Train 1"}
        - {id: t2, text: "Train 2"}
        - {id: t3, text: "Train 3"}
        - {id: t4, text: "Train 4"}
    answer: {chooser: b, option: t4}

  - id: gap_movie
    level: A2
    type: choose
    goal: "Ask about the movies and choose the one that fits the time and what you like."
    a:
      lines:
        - "The comedy starts at 6:00 and ends at 7:30. Tickets are 8 euros."
        - "The action movie starts at 7:00 and ends at 9:15. Tickets are 10 euros."
        - "The cartoon starts at 5:00 and ends at 6:30. Tickets are 6 euros."
        - "The love story starts at 8:00 and ends at 10:00. Tickets are 9 euros."
    b:
      lines:
        - "You finish work at 5:30."
        - "You must be home by 9:00."
        - "You don't like cartoons."
      options:
        - {id: comedy, text: "The comedy"}
        - {id: action, text: "The action movie"}
        - {id: cartoon, text: "The cartoon"}
        - {id: love, text: "The love story"}
    answer: {chooser: b, option: comedy}

  - id: gap_dinner
    level: A2
    type: choose
    goal: "Ask about the restaurants and choose the one that fits the time, the food and the budget."
    a:
      lines:
        - "Rosa's opens at 6 pm. It has fish and pasta. It is 15 euros a person."
        - "Kebab House opens at 5 pm. It has only meat. It is 10 euros a person."
        - "Green Garden opens at 7 pm. It has only vegetables. It is 12 euros a person."
        - "Sea Star opens at 5 pm. It has fish. It is 25 euros a person."
    b:
      lines:
        - "You want to eat at 6:30 pm."
        - "Your friend doesn't eat meat."
        - "You can pay 20 euros a person or less."
      options:
        - {id: rosa, text: "Rosa's"}
        - {id: kebab, text: "Kebab House"}
        - {id: green, text: "Green Garden"}
        - {id: sea, text: "Sea Star"}
    answer: {chooser: b, option: rosa}

  # --- Differences (A1) ----------------------------------------------------
  - id: gap_kitchen
    level: A1
    type: differences
    goal: "Describe a kitchen to each other and find the three differences."
    a:
      lines:
        - "There are two chairs."
        - "The table is next to the window."
        - "There is a cat on a chair."
        - "The fridge is white."
        - "There are three apples on the table."
        - "The clock says four o'clock."
    b:
      lines:
        - "There are three chairs."
        - "The table is next to the window."
        - "There is a dog on a chair."
        - "The fridge is white."
        - "There are three apples on the table."
        - "The clock says five o'clock."
    answer: {a: [0, 2, 5], b: [0, 2, 5]}

  - id: gap_park
    level: A1
    type: differences
    goal: "Describe a park to each other and find the three differences."
    a:
      lines:
        - "There are two children on the swings."
        - "A man is reading a newspaper."
        - "There is a red car near the gate."
        - "A woman is walking a small dog."
        - "It is sunny."
        - "There are four birds in the tree."
    b:
      lines:
        - "There are two children on the swings."
        - "A woman is reading a newspaper."
        - "There is a red car near the gate."
        - "A woman is walking a big dog."
        - "It is cloudy."
        - "There are four birds in the tree."
    answer: {a: [1, 3, 4], b: [1, 3, 4]}

  - id: gap_desk
    level: A1
    type: differences
    goal: "Describe a desk to each other and find the three differences."
    a:
      lines:
        - "There is a laptop on the desk."
        - "There are two pens next to the laptop."
        - "The lamp is on."
        - "There is a cup of coffee."
        - "A phone is under the books."
        - "There is a plant by the window."
    b:
      lines:
        - "There is a laptop on the desk."
        - "There is one pen next to the laptop."
        - "The lamp is off."
        - "There is a cup of tea."
        - "A phone is under the books."
        - "There is a plant by the window."
    answer: {a: [1, 2, 3], b: [1, 2, 3]}
