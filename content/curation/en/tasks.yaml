  - { text: "but", level: A1 }
  - { text: "or", level: A1 }
  - { text: "because", level: A1 }
  - { text: "so", level: A1 }
  - { text: "then", level: A1 }
  - { text: "also", level: A1 }
  - { text: "after that", level: A2 }
  - { text: "first", level: A2 }
  - { text: "finally", level: A2 }
  - { text: "when", level: A2 }
  - { text: "before", level: A2 }
  - { text: "after", level: A2 }
  - { text: "if", level: A2 }
  - { text: "for example", level: A2 }
  - { text: "although", level: B1 }
  - { text: "however", level: B1 }
  - { text: "while", level: B1 }
  - { text: "until", level: B1 }
  - { text: "as soon as", level: B1 }
  - { text: "since", level: B1 }
  - { text: "unless", level: B1 }
