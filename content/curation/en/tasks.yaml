# Speaking tasks for English (A11, docs/03-activities.md; docs/02-curriculum.md
# §7–§8; docs/11-language-packs.md §2).
#
# tasks: what the learner talks about, in the target language's terms.
#   anchor: ANC-1…3 are the fixed tasks of the monthly speaking test
#     (docs/06 §3.1). They are the same every month and at every level, have
#     no phrases (no chunk hints in the test) and are not offered as
#     practice, so that months compare.
#   level: the lowest level the task suits.
#   can_do: the can-do codes the task gives evidence for (docs/04 §5).
#   goal: what doing the task means; the tutor judges `done`, `partial` or
#     `not_done` against it (docs/07 §4.2).
#   phrases: three sentence starters shown with the task at A0–A2 (the
#     scaffold of docs/02 §3: "60 sn + 3 kalıp"); "..." is the learner's part.
#     US spelling, as in the pack.
# can_dos: our own codes for the Companion Volume scales the tasks touch;
#   the descriptors are not copied (docs/02 §8, docs/10 §2), only a short
#   summary in the pair pack.
# connectors: the connectors counted by `connector_types` (docs/06 §3.3).
#
# Written in a Claude Code session (ADR-0009); license: own. The learner's
# language comes from curation/<l1>-en/tasks.yaml; a task enters the packs
# only with an accepted independent check of its exact texts in
# curation/<l1>-en/tasks.validation.jsonl (I-16).

tasks:
  # --- Anchors (monthly test) -----------------------------------------------
  - id: anc_1
    anchor: ANC-1
    level: A1
    can_do: [cd.describe_experience.a1]
    goal: "Introduce yourself: who you are, what you do (your job or studies), where you live and what you like."
    phrases: []

  - id: anc_2
    anchor: ANC-2
    level: A1
    can_do: [cd.describe_experience.a2]
    goal: "Say what you did yesterday, from morning to evening."
    phrases: []

  - id: anc_3
    anchor: ANC-3
    level: A1
    can_do: [cd.describe_experience.a2]
    goal: "Talk about a problem you had recently and how you solved it, or why you could not solve it."
    phrases: []

  # --- A1 -----------------------------------------------------------------
  - id: daily_routine
    level: A1
    can_do: [cd.describe_experience.a1]
    goal: "Describe a typical day: what you do in the morning, during the day and in the evening."
    phrases:
      - "I usually get up at ..."
      - "After that, I ..."
      - "In the evening, I ..."

  - id: family
    level: A1
    can_do: [cd.describe_experience.a1]
    goal: "Talk about your family: who they are, what they do and where they live."
    phrases:
      - "There are ... people in my family."
      - "My mother works as a ..."
      - "My brother lives in ..."

  - id: home
    level: A1
    can_do: [cd.describe_experience.a1]
    goal: "Describe your home: the rooms, what is in them and your favorite place."
    phrases:
      - "My apartment has ... rooms."
      - "There is a ... in the living room."
      - "My favorite place is ..."

  - id: favorite_food
    level: A1
    can_do: [cd.describe_experience.a1]
    goal: "Talk about your favorite food: what it is, when you eat it and why you like it."
    phrases:
      - "My favorite food is ..."
      - "I usually eat it ..."
      - "I like it because ..."

  - id: cafe_order
    level: A1
    can_do: [cd.goods_services.a1]
    goal: "You are in a café. Order something to eat and drink, ask the price and ask for the check."
    phrases:
      - "Can I have a ..., please?"
      - "How much is it?"
      - "Can I have the check, please?"

  - id: free_time
    level: A1
    can_do: [cd.describe_experience.a1]
    goal: "Talk about what you do in your free time and who you do it with."
    phrases:
      - "In my free time, I ..."
      - "I often ... with ..."
      - "I really like ..."

  - id: best_friend
    level: A1
    can_do: [cd.describe_experience.a1]
    goal: "Talk about your best friend: their name, age and job, and what you do together."
    phrases:
      - "My best friend's name is ..."
      - "My best friend is ... years old."
      - "We often ... together."

  - id: weekends
    level: A1
    can_do: [cd.describe_experience.a1]
    goal: "Talk about what you usually do on the weekend."
    phrases:
      - "On the weekend, I ..."
      - "On Saturday mornings, I ..."
      - "On Sunday evenings, I ..."

  - id: my_city
    level: A1
    can_do: [cd.describe_experience.a1]
    goal: "Describe the city or town where you live: what is there and what you like about it."
    phrases:
      - "I live in ..."
      - "There are a lot of ... in my city."
      - "I like it because ..."

  - id: shopping
    level: A1
    can_do: [cd.describe_experience.a1]
    goal: "Talk about your shopping this week: what you need to buy and where you buy it."
    phrases:
      - "I need to buy ..."
      - "I usually go to ..."
      - "It's not expensive there."

  # --- A2 -----------------------------------------------------------------
  - id: last_holiday
    level: A2
    can_do: [cd.describe_experience.a2]
    goal: "Talk about your last vacation: where you went, what you did and how it was."
    phrases:
      - "Last summer, I went to ..."
      - "We stayed at ..."
      - "The best part was ..."

  - id: weekend_plans
    level: A2
    can_do: [cd.describe_experience.a2]
    goal: "Talk about your plans for the coming weekend: what you are going to do, where and with whom."
    phrases:
      - "This weekend, I'm going to ..."
      - "On Saturday, we're going to ..."
      - "If the weather is nice, ..."

  - id: directions
    level: A2
    can_do: [cd.information_exchange.a2]
    goal: "Explain how to get from your home to a store or a bus stop near it, step by step."
    phrases:
      - "Go straight for ..."
      - "Turn left at the ..."
      - "It's next to the ..."

  - id: return_item
    level: A2
    can_do: [cd.goods_services.a2]
    goal: "You are in a store. Explain that something you bought does not work, and say what you want: a new one or your money back."
    phrases:
      - "I bought this ... last week."
      - "It doesn't work."
      - "Can I have my money back, please?"

  - id: describe_friend
    level: A2
    can_do: [cd.describe_experience.a2]
    goal: "Describe a friend: what they look like, what they are like and why you like them."
    phrases:
      - "My friend has ... hair and ... eyes."
      - "My friend is very ..."
      - "I like spending time with my friend because ..."

  - id: childhood
    level: A2
    can_do: [cd.describe_experience.a2]
    goal: "Talk about your childhood: where you lived, what you did and what you liked."
    phrases:
      - "When I was a child, I lived in ..."
      - "Every day after school, I ..."
      - "My favorite game was ..."

  - id: recent_movie
    level: A2
    can_do: [cd.opinion.a2]
    goal: "Talk about a movie or series you watched recently: what it is about, whether you liked it and why."
    phrases:
      - "Last week, I watched ..."
      - "It's about ..."
      - "I liked it because ..."

  - id: compare_cities
    level: A2
    can_do: [cd.opinion.a2]
    goal: "Compare two cities you know: which is bigger, cheaper or nicer, and which one you prefer and why."
    phrases:
      - "... is bigger than ..."
      - "Life in ... is more expensive."
      - "I prefer ... because ..."

  - id: restaurant_problem
    level: A2
    can_do: [cd.goods_services.a2]
    goal: "You are in a restaurant and the waiter brought the wrong dish. Explain the problem politely and say what you ordered."
    phrases:
      - "Excuse me, I didn't order this."
      - "I ordered the ..."
      - "Could you change it, please?"

  - id: learning_english
    level: A2
    can_do: [cd.opinion.a2]
    goal: "Say why you are learning English, how you study and what is easy or difficult for you."
    phrases:
      - "I'm learning English because ..."
      - "I usually study ..."
      - "For me, ... is difficult."

can_dos:
  - { code: cd.describe_experience.a1, level: A1, scale: sustained_monologue_describing_experience }
  - { code: cd.describe_experience.a2, level: A2, scale: sustained_monologue_describing_experience }
  - { code: cd.goods_services.a1, level: A1, scale: obtaining_goods_and_services }
  - { code: cd.goods_services.a2, level: A2, scale: obtaining_goods_and_services }
  - { code: cd.information_exchange.a2, level: A2, scale: information_exchange }
  - { code: cd.opinion.a2, level: A2, scale: sustained_monologue_putting_a_case }

