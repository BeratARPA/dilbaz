# X_Lex placement bank curation (docs/06-assessment.md §2, docs/10 §5.3).
#
# seed: fixes the sample of real words per band and the pseudowords.
# exclude: real words left out of the bank, with the reason. Mostly
#   loanwords that a Turkish speaker recognises without knowing English
#   (Turkish "popüler", "televizyon", "pizza"): a "yes" to them says nothing
#   about English vocabulary. Excluding a word replaces only that word.
# reject_pseudowords: generated pseudowords rejected by hand.
# Written in a Claude Code session (ADR-0009); license: own.

