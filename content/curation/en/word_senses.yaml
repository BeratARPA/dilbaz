# S2 word-sense decisions on top of the automatic rule (docs/10-content-pipeline.md §4.2).
#
# include: everyday lemmas taken first, even when they are not on NGSL-Spoken.
# exclude: lemmas that are not word-sense cards. They are taught through
#   grammar points (be, not, question words, comparatives, particles) or
#   chunks (please, thank you, sorry, OK), are titles and gerunds, or are
#   abstract news words with little use in everyday conversation.
# senses: own glosses (license: own); they replace the first Wiktionary
#   sense, which is often not the one a learner needs ("pen" = an enclosure).
#   A lemma listed here gets exactly these senses. `level` overrides the
#   level lists where they miss the part of speech ("wake" is listed as a noun).
#   `ipa_uk`/`ipa_us` replace a transcription the sources get wrong.

include:
  # food and drink
  [breakfast, lunch, dinner, coffee, tea, bread, milk, egg, apple, fruit, vegetable, chicken,
   meat, fish, rice, cake, juice, cup, glass, bottle,
  # home
   kitchen, bathroom, bedroom, bed, table, chair, window, door, floor, garden,
  # time and weather
   monday, tuesday, wednesday, thursday, friday, saturday, sunday, weekend, afternoon, evening,
   tomorrow, yesterday, birthday, holiday, winter, spring, autumn, weather, rain, sun, hot, cold,
   warm,
  # places and travel
   shop, restaurant, hotel, airport, station, bus, train, ticket, map, village, mountain, sea,
   beach, river, hospital,
  # things
   bag, shoe, clothes, shirt, dress, computer, email, message, internet, photo, pen,
  # people
   husband, daughter, sister, boyfriend, girlfriend, teacher, boss,
  # describing people and things
   tired, hungry, thirsty, cheap, expensive, rich, poor, healthy, tall, sad, angry, afraid, bored,
   busy, difficult, interesting, boring, favorite, funny, quiet, dirty, slow, sick,
  # daily actions
   wake, cook, clean, wash, dance, sing, swim, ride, fly,
  # school, free time, nature
   homework, exam, lesson, hobby, sport, football, animal, cat, bird, tree, flower]

exclude:
  # grammar points
  - be
  - it
  - not
  - may
  - can
  - when
  - where
  - why
  - how
  - ever
  - yet
  - most
  - less
  - better
  - best
  - so
  - all
  - else
  - either
  - rather
  - lot
  - both
  - used
  - in
  - "on"
  - about
  - over
  - "off"
  - after
  - before
  - along
  - across
  - above
  - behind
  - round
  - past
  - forward
  - due
  - further
  # chunks
  - "no"
  - "yes"
  - please
  - thank
  - thanks
  - ok
  - yeah
  - sorry
  # titles, gerunds and forms taught with their verb
  - mr.
  - mrs.
  - being
  - given
  - following
  - living
  - running
  - saw
  - self
  - post
  # abstract or news words, little use in everyday conversation
  - state
  - system
  - case
  - support
  - base
  - set
  - report
  - care
  - government
  - issue
  - power
  - public
  - law
  - force
  - lead
  - control
  - national
  - deal
  - research
  - vote
  - rate
  - major
  - position
  - value
  - figure
  - trade
  - product
  - review
  - sense
  - response
  - statement
  - staff
  - committee
  - specific

