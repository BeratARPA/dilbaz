# Answer normalization for English (docs/03-activities.md §0.5, docs/11 §6).
#
# The engine (LanguageServices.normalize) and the content tools apply these
# rules in this order, so an answer and a reference compare word for word:
#   1. lowercase
#   2. apostrophes: every character in `apostrophes` becomes '
#   3. every character in `punctuation` becomes a space
#   4. split on spaces; per word, the first rule that applies:
#      a. `words`: whole-word replacements (contractions such as "can't")
#      b. `endings`: a word ending in one of these keys loses it and gets the
#         value ("didn't" → "did not")
#   5. per word again: `spellings` (British → American, variants); then any
#      remaining apostrophe is removed ("tom's" → "toms") and a hyphen becomes
#      a space ("twenty-one" → "twenty one")
#   6. a word of digits (0-999) is written in words ("35" → "thirty five")
#   7. words are joined by single spaces
# `tests` hold examples both implementations must pass.

version: 1

apostrophes: ["’", "‘", "`", "´", "ʼ"]

punctuation: ".,!?;:\"“”()[]{}…/—–"

words:
  "can't": "can not"
  "cannot": "can not"
  "won't": "will not"
  "shan't": "shall not"
  "ain't": "is not"
  "let's": "let us"
  "i'm": "i am"
  "it's": "it is"
  "that's": "that is"
  "this's": "this is"
  "what's": "what is"
  "where's": "where is"
  "when's": "when is"
  "who's": "who is"
  "how's": "how is"
  "why's": "why is"
  "there's": "there is"
  "here's": "here is"
  "he's": "he is"
  "she's": "she is"
  "gonna": "going to"
  "wanna": "want to"
  "gotta": "got to"

endings:
  "n't": " not"
  "'re": " are"
  "'ve": " have"
  "'ll": " will"
  "'d": " would"
  "'m": " am"

spellings:
  aeroplane: airplane
  analyse: analyze
  behaviour: behavior
  centre: center
  cheque: check
  colour: color
  colours: colors
  cosy: cozy
  defence: defense
  e-mail: email
  e-mails: emails
  favourite: favorite
  favourites: favorites
  flavour: flavor
  grey: gray
  harbour: harbor
  honour: honor
  humour: humor
  jewellery: jewelry
  kilometre: kilometer
  kilometres: kilometers
  labour: labor
  licence: license
  litre: liter
  metre: meter
  metres: meters
  mum: mom
  neighbour: neighbor
  neighbours: neighbors
  ok: okay
  organise: organize
  practise: practice
  programme: program
  pyjamas: pajamas
  realise: realize
  theatre: theater
  travelled: traveled
  travelling: traveling
  tyre: tire

numbers:
  units: [zero, one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve,
          thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen]
  tens: [null, null, twenty, thirty, forty, fifty, sixty, seventy, eighty, ninety]
  hundred: hundred

tests:
  - ["I'm fine, thanks.", "i am fine thanks"]
  - ["Don't worry!", "do not worry"]
  - ["I can't swim.", "i can not swim"]
  - ["I cannot swim.", "i can not swim"]
  - ["What's your favourite colour?", "what is your favorite color"]
  - ["I have 2 brothers.", "i have two brothers"]
  - ["She's twenty-one.", "she is twenty one"]
  - ["She is 21.", "she is twenty one"]
  - ["We'll see.", "we will see"]
  - ["I'd like a coffee.", "i would like a coffee"]
  - ["They've got 305 cats.", "they have got three hundred five cats"]
  - ["That is Tom's car.", "that is toms car"]
  - ["OK, let's go.", "okay let us go"]
  - ["It’s  a   nice day…", "it is a nice day"]
  - ["Send me an e-mail.", "send me an email"]
  - ["I didn't know.", "i did not know"]
  - ["You're right, aren't you?", "you are right are not you"]
  - ["\"Hello\", she said.", "hello she said"]
  - ["I'm gonna call you.", "i am going to call you"]
